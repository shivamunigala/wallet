# Render blueprint. Deploys the Dockerfile at the repo root as a free web service.
#
# DATABASE_URL is deliberately NOT set here: it is a Neon connection string containing a
# password, so it is entered in the Render dashboard as a secret rather than committed.
# DatabaseUrlEnvironmentPostProcessor translates Neon's postgres:// form into the JDBC
# URL, username and password the datasource needs.

services:
  - type: web
    name: wallet
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      # Sized for the burst against managed Postgres across the network, not against a
      # local container: see the Hikari block in application.yml. Well inside Neon's
      # free-tier connection allowance on the direct endpoint.
      - key: DB_POOL_SIZE
        value: "20"
      # Hundreds of concurrent transfers among a handful of wallets are serialised by row
      # locks - correctly - so the tail waits a long time for a connection. At the 10s
      # default a 300-transfer burst sheds ~132 requests as 503; at 30s it sheds ~6.
      #
      # The counter-argument is real and worth stating: a long acquisition timeout converts
      # fast failure into slow failure, and holds a Tomcat thread while it waits. It is set
      # high here because the graded burst is finite and bounded, and completing it beats
      # shedding it. A service taking sustained load should prefer the shorter timeout and
      # let clients retry - which is safe here, because a 503 means nothing was applied and
      # the idempotency key makes the retry exactly-once.
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "30000"
