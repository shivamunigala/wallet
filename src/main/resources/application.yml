spring:
  application:
    name: wallet

  jackson:
    # The brief's request bodies use snake_case (amount_paise, idempotency_key), so the
    # whole API speaks snake_case rather than annotating every field.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  datasource:
    # Populated by DatabaseUrlEnvironmentPostProcessor from DATABASE_URL when the
    # host provides one (Neon and Render both hand out postgres:// URLs, which JDBC
    # cannot parse). Falls back to a local Postgres for development.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${SPRING_DATASOURCE_USERNAME:wallet}
    password: ${SPRING_DATASOURCE_PASSWORD:wallet}
    hikari:
      # Money operations hold row locks, so the pool is deliberately small and the
      # wait bounded: better to shed load fast than to queue behind held locks.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      pool-name: wallet-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  # Render injects PORT at runtime; default to 8080 locally.
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    distribution:
      # p99 latency for the /metrics requirement in the brief.
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: wallet

logging:
  level:
    root: INFO
    com.shiva.wallet: INFO
