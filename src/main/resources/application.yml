spring:
  application:
    name: wallet

  jackson:
    # The brief's request bodies use snake_case (amount_paise, idempotency_key), so the
    # whole API speaks snake_case rather than annotating every field.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  datasource:
    # Populated by DatabaseUrlEnvironmentPostProcessor from DATABASE_URL when the
    # host provides one (Neon and Render both hand out postgres:// URLs, which JDBC
    # cannot parse). Falls back to a local Postgres for development.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${SPRING_DATASOURCE_USERNAME:wallet}
    password: ${SPRING_DATASOURCE_PASSWORD:wallet}
    hikari:
      # Money operations hold row locks, so the pool stays modest: a deep pool would just
      # move the queue from Hikari into Postgres, where the waiters hold locks instead of
      # waiting for one. But it must be sized against the *latency* of the database, not
      # the local one. A POST /transfers takes four connections in sequence - two wallet
      # reads, the idempotency lookup, then the transactional execute - so N concurrent
      # transfers demand 4N acquisitions. Against Postgres on the same Docker network each
      # is sub-millisecond and a pool of 5 absorbs a 60-transfer burst; against managed
      # Postgres across the network each acquisition is held for milliseconds, the queue
      # deepens, and the wait exceeds the timeout. That is what a pool of 5 with a 3s
      # timeout did on the first live burst: 41 of 60 transfers timed out acquiring a
      # connection. Nothing was lost - conservation still held, because the transactions
      # never started - which is exactly why the burst asserts on status codes too.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      pool-name: wallet-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # The two ledger rows of a transfer go out as one round trip. Round trips are
          # the scarce resource here: they happen while row locks are held, so each one
          # adds directly to how long other transfers on the same wallets must wait.
          batch_size: 20
        order_inserts: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    # Flyway guards migrations with a session-level advisory lock. Two instances starting
    # at once (a Render rolling deploy does exactly this) contend for it, so retry rather
    # than failing the boot. Note: point this at a DIRECT database endpoint, never a
    # PgBouncer-pooled one - in transaction pooling the unlock lands on a different
    # backend and the lock leaks until that session is killed.
    lock-retry-count: 30

server:
  # Render injects PORT at runtime; default to 8080 locally.
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    distribution:
      # p99 latency for the /metrics requirement in the brief.
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: wallet

logging:
  level:
    root: INFO
    com.shiva.wallet: INFO
